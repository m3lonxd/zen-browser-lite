// NexLite autoconfig: Firefox ignores this first line. Loaded once per browser start.
//
// Timed tab unloader for Zen Browser.
//
// Zen shows a "tab unloader" timeout in its settings, but the 1.24 builds no longer
// ship code that reads it, so background tabs stay in memory until the system is
// almost out of RAM. This script unloads tabs that have not been looked at for
// `nexlite.unloader.after-seconds`. An unloaded tab keeps its place, title, icon and
// history; clicking it reloads the page.
//
// A tab is never unloaded while it is:
//   - selected, or visible in a split view;
//   - playing sound, or sharing camera, microphone or screen;
//   - shown in picture-in-picture;
//   - still loading;
//   - a Zen Glance preview or Zen's empty new-tab placeholder;
//   - pinned or an Essential (unless nexlite.unloader.include-pinned is true);
//   - holding a page that asks before leaving (unsaved form, editor, upload).
//
// All settings are ordinary prefs and can be changed in about:config:
//   nexlite.unloader.enabled         bool  turn the unloader on or off (live)
//   nexlite.unloader.after-seconds   int   idle time before a tab is unloaded (live)
//   nexlite.unloader.check-seconds   int   how often tabs are checked (live)
//   nexlite.unloader.include-pinned  bool  also unload pinned tabs and Essentials (live)
//
// This file runs with chrome privileges. It does not read page content, touch the
// network or write any file.

(function nexliteUnloader() {
  "use strict";

  const PREFIX = "nexlite.unloader.";
  const MIN_CHECK_SECONDS = 5;
  const MIN_AFTER_SECONDS = 10;

  const prefInt = (name, fallback, min) => {
    let value;
    try {
      value = Services.prefs.getIntPref(PREFIX + name, fallback);
    } catch (e) {
      value = fallback;
    }
    return Math.max(min, value);
  };
  const prefBool = (name, fallback) => {
    try {
      return Services.prefs.getBoolPref(PREFIX + name, fallback);
    } catch (e) {
      return fallback;
    }
  };

  // First time each tab was seen by a sweep. A tab opened in the background has never
  // been selected, so its own lastAccessed can be its creation time or 0; this keeps a
  // freshly opened background tab from being unloaded on the very next sweep.
  const firstSeen = new WeakMap();
  let timer = null;
  let stopped = false;

  function isProtected(tab, includePinned) {
    const browser = tab.linkedBrowser;
    return (
      !tab.linkedPanel || // already unloaded
      tab.selected ||
      tab.closing ||
      tab.hasAttribute("zen-glance-tab") ||
      tab.hasAttribute("zen-empty-tab") ||
      tab.hasAttribute("busy") ||
      tab.hasAttribute("soundplaying") ||
      tab.hasAttribute("sharing") ||
      tab.hasAttribute("pictureinpicture") ||
      (!includePinned && (tab.pinned || tab.hasAttribute("zen-essential"))) ||
      !browser ||
      browser.docShellIsActive // on screen, e.g. the other half of a split view
    );
  }

  function sweepWindow(win, now, afterMs, includePinned) {
    const gBrowser = win.gBrowser;
    if (!gBrowser || win.closed) {
      return;
    }
    for (const tab of gBrowser.tabs) {
      if (!firstSeen.has(tab)) {
        firstSeen.set(tab, now);
      }
      if (isProtected(tab, includePinned)) {
        continue;
      }
      const lastUsed = Math.max(tab.lastAccessed || 0, firstSeen.get(tab));
      if (now - lastUsed < afterMs) {
        continue;
      }
      try {
        // Not forced: Firefox refuses to discard pages with a beforeunload handler.
        gBrowser.discardBrowser(tab);
      } catch (e) {
        console.error("NexLite: could not unload a tab", e);
      }
    }
  }

  function sweep() {
    if (stopped) {
      return;
    }
    try {
      if (prefBool("enabled", true)) {
        const now = Date.now();
        const afterMs = prefInt("after-seconds", 900, MIN_AFTER_SECONDS) * 1000;
        const includePinned = prefBool("include-pinned", false);
        for (const win of Services.wm.getEnumerator("navigator:browser")) {
          sweepWindow(win, now, afterMs, includePinned);
        }
      }
    } catch (e) {
      console.error("NexLite: unloader sweep failed", e);
    }
    schedule();
  }

  function schedule() {
    if (stopped) {
      return;
    }
    timer ??= Cc["@mozilla.org/timer;1"].createInstance(Ci.nsITimer);
    timer.initWithCallback(
      sweep,
      prefInt("check-seconds", 60, MIN_CHECK_SECONDS) * 1000,
      Ci.nsITimer.TYPE_ONE_SHOT
    );
  }

  let started = false;
  Services.obs.addObserver(function onFirstWindow() {
    if (started) {
      return;
    }
    started = true;
    Services.obs.removeObserver(onFirstWindow, "browser-delayed-startup-finished");
    schedule();
  }, "browser-delayed-startup-finished");

  Services.obs.addObserver(function onQuit() {
    stopped = true;
    timer?.cancel();
  }, "quit-application-granted");
})();
