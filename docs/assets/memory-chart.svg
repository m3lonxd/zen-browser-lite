<svg xmlns="http://www.w3.org/2000/svg" width="960" height="566" viewBox="0 0 960 566" role="img" aria-label="Memory use: Zen compared with Zen Browser Lite">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1412"/><stop offset="1" stop-color="#070c0b"/>
    </linearGradient>
    <style>
      .h { font: 700 19px Inter, -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; fill: #f2fff8; }
      .sub { font: 400 13px Inter, -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; fill: #7f948b; }
      .t { font: 800 26px Inter, -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; fill: #f2fff8; letter-spacing: -0.5px; }
      .lbl { font: 500 14px Inter, -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif; fill: #c9d8d1; }
      .val { font: 600 13px 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: #06110d; opacity: 0; animation: fade .5s ease-out forwards; }
      .procs { font-weight: 400; }
      .pct { font: 700 15px 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: #3ddc84; opacity: 0; animation: fade .5s ease-out forwards; }
      .foot { font: 400 12px 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: #63766e; }
      .track { fill: #ffffff; fill-opacity: .045; }
      .bar { transform-box: fill-box; transform-origin: left center; transform: scaleX(0);
              animation: grow 1.1s cubic-bezier(.2,.8,.2,1) forwards; }
      @keyframes grow { to { transform: scaleX(1); } }
      @keyframes fade { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .bar { animation: none; transform: none; } .val, .pct { animation: none; opacity: 1; }
      }
    </style>
  </defs>
  <rect width="960" height="566" rx="22" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="959" height="565" rx="21.5" fill="none" stroke="#fff" stroke-opacity=".1"/>
  <text x="40" y="62" class="t">Memory use, same tabs</text>
  <text x="40" y="86" class="sub">Lower is better. All browser processes counted, shared memory split fairly.</text>
  <text x="40" y="134" class="h">All tabs loaded</text><text x="40" y="154" class="sub">90 s after start</text><text x="40" y="190" class="lbl">Zen (stock)</text><rect x="210" y="170" width="600" height="30" rx="8" class="track"/><rect x="210" y="170" width="600.0" height="30" rx="8" fill="#6b7a74" class="bar" style="animation-delay:0.00s"/><text x="222" y="190" class="val" style="animation-delay:0.30s">1.31 GB <tspan class="procs">· 20 processes</tspan></text><text x="40" y="232" class="lbl">Lite tier</text><rect x="210" y="212" width="600" height="30" rx="8" class="track"/><rect x="210" y="212" width="524.7" height="30" rx="8" fill="#2fd3c4" class="bar" style="animation-delay:0.12s"/><text x="222" y="232" class="val" style="animation-delay:0.42s">1.15 GB <tspan class="procs">· 15 processes</tspan></text><text x="748.6768682216609" y="232" class="pct" style="animation-delay:0.62s">-13%</text><text x="40" y="274" class="lbl">Max tier</text><rect x="210" y="254" width="600" height="30" rx="8" class="track"/><rect x="210" y="254" width="477.4" height="30" rx="8" fill="#3ddc84" class="bar" style="animation-delay:0.24s"/><text x="222" y="274" class="val" style="animation-delay:0.54s">1.05 GB <tspan class="procs">· 10 processes</tspan></text><text x="701.3882038330114" y="274" class="pct" style="animation-delay:0.74s">-20%</text><text x="40" y="332" class="h">Background tabs idle</text><text x="40" y="352" class="sub">after the unload timer</text><text x="40" y="388" class="lbl">Zen (stock)</text><rect x="210" y="368" width="600" height="30" rx="8" class="track"/><rect x="210" y="368" width="548.3" height="30" rx="8" fill="#6b7a74" class="bar" style="animation-delay:0.36s"/><text x="222" y="388" class="val" style="animation-delay:0.66s">1.20 GB <tspan class="procs">· 19 processes</tspan></text><text x="40" y="430" class="lbl">Lite tier</text><rect x="210" y="410" width="600" height="30" rx="8" class="track"/><rect x="210" y="410" width="221.2" height="30" rx="8" fill="#2fd3c4" class="bar" style="animation-delay:0.48s"/><text x="222" y="430" class="val" style="animation-delay:0.78s">496 MB <tspan class="procs">· 8 processes</tspan></text><text x="445.15584608527706" y="430" class="pct" style="animation-delay:0.98s">-60%</text><text x="40" y="472" class="lbl">Max tier</text><rect x="210" y="452" width="600" height="30" rx="8" class="track"/><rect x="210" y="452" width="246.4" height="30" rx="8" fill="#3ddc84" class="bar" style="animation-delay:0.60s"/><text x="222" y="472" class="val" style="animation-delay:0.90s">553 MB <tspan class="procs">· 7 processes</tspan></text><text x="470.3824097459516" y="472" class="pct" style="animation-delay:1.10s">-55%</text>
  <text x="40" y="542" class="foot">Zen 1.24.1b · 7 real sites · PSS + SwapPss, median of 3 runs · 2026-11-10</text>
</svg>
